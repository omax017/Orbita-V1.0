version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hubwin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hubwin
      POSTGRES_PASSWORD: hubwin
      POSTGRES_DB: hubwin
    ports:
      - "5432:5432"
    volumes:
      - hubwin_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubwin"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hubwin-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - hubwin_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hubwin_postgres_data:
  hubwin_redis_data:
